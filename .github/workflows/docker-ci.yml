name: docker-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:
      # 1. get the code onto the runner
      - name: Checkout
        uses: actions/checkout@v4

      # 2. BUILD - compose builds the api image exactly like on your laptop
      - name: Build the image
        run: docker compose build

      # 3. TEST - bring up the REAL stack and prove it works end to end
      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test - health, predict, history
        run: |
          # wait for the api (it retries the db internally - S13 lesson!)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf "http://localhost:8000/predict?x=21" | grep '"prediction":42.0'
          curl -sf http://localhost:8000/history | grep '"count":1'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      # 4. SCAN - the security gate. HIGH/CRITICAL = red pipeline.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.58.1
        
      - name: Trivy scan
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed predict-api:ci

      # 5. PUSH - only on main (PRs get tested + scanned, but never publish)
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/predict-api
          docker tag predict-api:ci $IMAGE:$SHORT_SHA
          docker tag predict-api:ci $IMAGE:main
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:main